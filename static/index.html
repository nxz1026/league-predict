<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>league-predict 数据台</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#10141c;--panel:#171c27;--panel2:#1e2533;--line:#2a3344;--fg:#e6ecf5;--mut:#8ea0b8;--acc:#4c8dff;--ok:#3fbf6f;--warn:#e0a13c;--err:#e0564d;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.55}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(16,20,28,.96);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.3px}
nav.tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav.tabs button{background:none;border:1px solid transparent;color:var(--mut);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
nav.tabs button.active{color:var(--fg);background:var(--panel2);border-color:var(--line)}
nav.tabs button:hover{color:var(--fg)}
#user{color:var(--mut);font-size:13px;display:flex;align-items:center;gap:8px}
#logout{background:none;border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:4px 10px;cursor:pointer}
#logout:hover{color:var(--err);border-color:var(--err)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.tab{display:none}
.tab.active{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:14px;color:var(--fg)}
.mut{color:var(--mut)}
.small{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.league-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.league-head b{font-size:14px}
.league-head .small{color:var(--mut)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;font-size:12px}
tr:last-child td{border-bottom:none}
.empty{padding:22px 12px;text-align:center;color:var(--mut)}
.placeholder{border:1px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--mut);font-size:13px}
.err{color:var(--err);border-color:var(--err)}
.btn{background:var(--acc);border:none;color:#fff;padding:7px 16px;border-radius:8px;cursor:pointer;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--fg)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;border:1px solid var(--line);color:var(--mut)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.badge.err{color:var(--err);border-color:var(--err)}
.bar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:6px}
details.ai{margin-top:10px}
details.ai summary{cursor:pointer;color:var(--acc);font-size:13px}
.ai-msg{padding:10px 12px;margin-top:8px;background:var(--panel2);border-left:3px solid var(--warn);border-radius:6px;font-size:13px;white-space:pre-wrap}
.ai-msg.ok{border-left-color:var(--ok)}
.chart{width:100%;height:340px}
input[type=date]{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px;font-size:13px}
.mono{font-family:var(--mono);font-size:12px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stars{color:var(--warn);letter-spacing:1px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 18px;border-radius:10px;z-index:99;display:none;max-width:80%}
</style>
</head>
<body>
<header>
  <h1>⚽ league-predict</h1>
  <nav class="tabs" id="tabs">
    <button data-tab="today" class="active">今日赛程</button>
    <button data-tab="history">历史预测</button>
    <button data-tab="champ">冠军概率</button>
    <button data-tab="accuracy">准确率</button>
    <button data-tab="ops">任务与数据源</button>
  </nav>
  <div id="user"><span class="mut" id="username"></span><button id="logout">退出</button></div>
</header>
<main>
  <section class="tab active" id="tab-today"><div class="panel"><h3>今日赛程</h3><div id="today-body"><div class="placeholder">加载中…</div></div></div></section>
  <section class="tab" id="tab-history"><div class="panel"><h3>历史预测</h3><div class="toolbar">
      <label class="mut small">比赛日 <input type="date" id="hist-date"></label>
      <button class="btn ghost" id="hist-load">查询</button>
    </div><div id="history-body"><div class="placeholder">选择日期查询</div></div></div></section>
  <section class="tab" id="tab-champ"><div class="panel"><h3>冠军概率</h3><div id="champ-body"><div class="placeholder">加载中…</div></div></div></section>
  <section class="tab" id="tab-accuracy"><div class="panel"><h3>准确率</h3><div id="acc-body"><div class="placeholder">加载中…</div></div></div></section>
  <section class="tab" id="tab-ops"><div class="panel"><h3>任务与数据源</h3><div id="ops-body"></div></div></section>
</main>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script>
"use strict";
const API="/api/v1";
/* ---- 统一 fetch 层 ---- */
async function api(path, opts={}){
  let res;
  try{
    res=await fetch(API+path, Object.assign({credentials:"same-origin",headers:{"Content-Type":"application/json"}},opts));
  }catch(e){
    throw new Error("网络请求失败："+e.message);
  }
  if(res.status===401){ location.href="/login"; throw new Error("未登录"); }
  let body=null;
  try{ body=await res.json(); }catch(_){ /* 非 JSON 响应也走统一错误 */ }
  if(!res.ok){
    const msg=(body&&body.message)||("请求失败 HTTP "+res.status);
    const err=new Error(msg); err.status=res.status; err.body=body; throw err;
  }
  return body;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function bjtToday(){ const s=new Date().toLocaleString("en-US",{timeZone:"Asia/Shanghai"}); const d=new Date(s); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>{t.style.display="none";},2600); }
function stars(n){ const s=String(n||""); return "<span class=\"stars\">"+esc(s)+"</span>"; }
function placeholder(el,text,cls){ el.innerHTML="<div class=\"placeholder "+(cls||"")+"\">"+esc(text)+"</div>"; }
function fmtDT(iso){ if(!iso) return "—"; const d=new Date(iso); if(isNaN(d)) return esc(iso); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes()); }
/* ---- tab 切换 ---- */
const TABS=["today","history","champ","accuracy","ops"];
document.getElementById("tabs").addEventListener("click",e=>{
  const btn=e.target.closest("button"); if(!btn) return;
  TABS.forEach(t=>{
    document.getElementById("tab-"+t).classList.toggle("active",t===btn.dataset.tab);
  });
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("active",b===btn));
  const fn={today:loadToday,history:loadHistory,champ:loadChamp,accuracy:loadAccuracy,ops:loadOps}[btn.dataset.tab];
  if(fn) fn();
});
/* ---- 顶栏：用户名 + 退出 ---- */
api("/me").then(m=>{ document.getElementById("username").textContent=m.username||""; }).catch(e=>{ if(e.status!==401) toast("加载用户信息失败"); });
document.getElementById("logout").addEventListener("click",async ()=>{
  try{ await api("/logout",{method:"POST"}); }catch(_){}
  location.href="/login";
});
/* ---- tab: 今日赛程 ---- */
function cardLeague(league, name, items){
  const rows=items.map(p=>"<tr><td>"+esc(p.match||(p.home+" vs "+p.away))+"</td><td>"+esc(p.direction)+"</td><td>"+stars(p.stars)+"</td><td>"+esc(p.predicted_score)+"</td><td class=\"small mut\">"+esc(p.over_under||"")+" / "+esc(p.btts||"")+"</td><td class=\"small mut\">λ "+esc(p.lambda_home??"")+":"+esc(p.lambda_away??"")+"</td></tr>").join("");
  return "<div class=\"card\"><div class=\"league-head\"><b>"+esc(name)+"</b><span class=\"small mut\">"+esc(league)+"</span></div>"+
    (rows?"<table><thead><tr><th>比赛</th><th>方向</th><th>信心</th><th>比分</th><th>大小/BTTS</th><th>λ</th></tr></thead><tbody>"+rows+"</tbody></table>":"<div class=\"empty\">该联赛今日无预测数据</div>")+"</div>";
}
async function loadToday(){
  const body=document.getElementById("today-body");
  try{
    const data=await api("/predictions/today");
    const leagues=data.leagues||{};
    const names={epl:"English Premier League",laliga:"La Liga",bundesliga:"Bundesliga",seriea:"Serie A",ligue1:"Ligue 1"};
    const keys=Object.keys(leagues);
    if(!keys.length){ placeholder(body,"今日暂无任何联赛数据",""); return; }
    const html=keys.map(k=>cardLeague(k,names[k]||k,leagues[k]||[])).join("");
    body.innerHTML="<div class=\"small mut\" style=\"margin-bottom:8px\">BJT 比赛日：<b>"+esc(data.date||"")+"</b></div><div class=\"grid\">"+html+"</div><div class=\"panel\"><h3>AI 解读</h3><div id=\"ai-zone\"></div></div>";
    loadAI();
  }catch(e){ placeholder(body,(e.status===429?"配额不足：":"加载失败：")+e.message,"err"); }
}
async function loadAI(){
  const zone=document.getElementById("ai-zone"); if(!zone) return;
  try{
    const st=await api("/ai/status");
    if(!st.available){
      zone.innerHTML="<div class=\"ai-msg\">AI 解读暂不可用"+(st.reason?("："+esc(st.reason)):"")+"</div>";
      return;
    }
    const det=await api("/ai/details");
    if(!det.available||!det.items||!det.items.length){ zone.innerHTML="<div class=\"ai-msg\">暂无 AI 富化数据</div>"; return; }
    zone.innerHTML=det.items.map(it=>"<details class=\"ai\"><summary>"+esc(it.match||"")+" <span class=\"badge\">score "+(it.ai_score==null?"—":it.ai_score)+"</span></summary><div class=\"ai-msg ok\">"+esc(it.ai_summary||"")+(it.ai_notes?("\n\n"+esc(it.ai_notes)):"")+"</div></details>").join("");
  }catch(e){ zone.innerHTML="<div class=\"ai-msg\">AI 解读暂不可用"+(e.message?("："+esc(e.message)):"")+"</div>"; }
}
/* ---- tab: 历史预测 ---- */
function leagueSelectTag(cur){
  const opts=["epl","laliga","bundesliga","seriea","ligue1",""]
    .map(l=>"<option value=\""+l+"\""+(l===cur?" selected":"")+">"+(l||"全部")+"</option>").join("");
  return "<label class=\"mut small\">联赛 <select id=\"hist-league\" class=\"sel\">"+opts+"</select></label>";
}
async function loadHistory(){
  const body=document.getElementById("history-body");
  const input=document.getElementById("hist-date");
  const d=input.value||bjtToday(); input.value=d;
  try{
    const data=await api("/predictions/"+d);
    body.innerHTML="";
    const labelTag=document.createElement("div"); labelTag.innerHTML=leagueSelectTag("");
    labelTag.querySelector("select").addEventListener("change",()=>renderHist(data));
    body.appendChild(labelTag.firstChild);
    renderHist(data);
  }catch(e){ placeholder(body,"加载失败："+e.message,"err"); }
}
function renderHist(data){
  const body=document.getElementById("history-body");
  const sel=document.getElementById("hist-league");
  const league=sel?sel.value:"";
  const leagues=data.leagues||{};
  const idx=document.getElementById("hist-items"); if(idx) idx.remove();
  const wrap=document.createElement("div"); wrap.id="hist-items";
  const keys=league?[league]:Object.keys(leagues);
  let any=false;
  for(const k of keys){
    const items=leagues[k]||[]; if(!items.length) continue; any=true;
    const rows=items.map(p=>"<tr><td>"+esc(p.match||(p.home+" vs "+p.away))+"</td><td>"+esc(p.direction)+"</td><td>"+stars(p.stars)+"</td><td>"+esc(p.predicted_score)+"</td><td class=\"small mut\">"+esc(p.kickoff_utc||"")+"</td></tr>").join("");
    wrap.insertAdjacentHTML("beforeend","<div class=\"card\" style=\"margin-top:10px\"><div class=\"league-head\"><b>"+k+"</b></div><table><thead><tr><th>比赛</th><th>方向</th><th>信心</th><th>比分</th><th>开球(UTC)</th></tr></thead><tbody>"+rows+"</tbody></table></div>");
  }
  if(!any){ wrap.innerHTML="<div class=\"placeholder\">该日期没有预测数据（BJT 寒暄：试试其他日期）</div>"; }
  body.appendChild(wrap);
}
document.getElementById("hist-load").addEventListener("click",loadHistory);
/* ---- tab: 冠军概率 ---- */
async function loadChamp(){
  const body=document.getElementById("champ-body");
  body.innerHTML="<div class=\"placeholder\">加载中…</div>";
  try{
    const data=await api("/championship");
    const leagues=data.leagues||{}; const keys=Object.keys(leagues);
    if(!keys.length){ placeholder(body,"暂无冠军概率数据（等待首次预测）"); return; }
    body.innerHTML="<div class=\"chart\" id=\"champ-chart\"></div>"+keys.map(k=>{
      const mc=leagues[k]; const probs=mc.champion_probs||{};
      const top=Object.entries(probs).sort((a,b)=>b[1]-a[1]).slice(0,8);
      return "<div class=\"card\" style=\"margin-top:12px\"><div class=\"league-head\"><b>"+k+"</b><span class=\"small mut\">sims "+esc(mc.simulation_count??"")+" · 窗口 "+esc(mc.data_window||"")+"</span></div>"+(top.length?"<table><thead><tr><th>球队</th><th>冠军概率</th></tr></thead><tbody>"+top.map(r=>"<tr><td>"+esc(r[0])+"</td><td>"+(r[1]*100).toFixed(1)+"%</td></tr>").join("")+"</tbody></table>":"<div class=\"empty\">无 champion_probs</div>")+"</div>";
    }).join("");
    drawChampChart(leagues,keys);
  }catch(e){ placeholder(body,"加载失败："+e.message,"err"); }
}
function drawChampChart(leagues,keys){
  if(typeof echarts==="undefined") return;
  const tb=Math.max(keys.length,1)*40;
  const el=document.getElementById("champ-chart"); el.style.height=Math.max(340,tb)+"px";
  const chart=echarts.init(el);
  const teams=new Set();
  keys.forEach(k=>{ Object.keys(leagues[k].champion_probs||{}).forEach(t=>teams.add(t)); });
  const palette=["#4c8dff","#3fbf6f","#e0a13c","#e0564d","#9b6bff","#3fb9bf","#e07ab5","#8ea0b8"];
  const series=[...teams].slice(0,8).map((t,i)=>({
    name:t,type:"bar",stack:"p",data:keys.map(k=>{const p=(leagues[k].champion_probs||{})[t];return p?+(p*100).toFixed(1):0;}),itemStyle:{color:palette[i%palette.length]}
  }));
  chart.setOption({
    title:{text:"各联赛夺冠概率分布（堆叠，%）",left:"center",textStyle:{color:"#e6ecf5",fontSize:13}},
    tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},
    legend:{top:26,textStyle:{color:"#8ea0b8"},type:"scroll"},
    grid:{left:16,right:24,top:70,bottom:16,containLabel:true},
    xAxis:{type:"category",data:keys,axisLabel:{color:"#e6ecf5"}},
    yAxis:{type:"value",axisLabel:{color:"#8ea0b8",formatter:"{value}%"}},
    series
  });
}
/* ---- tab: 准确率 ---- */
async function loadAccuracy(){
  const body=document.getElementById("acc-body");
  body.innerHTML="<div class=\"placeholder\">加载中…</div>";
  try{
    const data=await api("/accuracy");
    const leagues=data.leagues||{}; const keys=Object.keys(leagues);
    if(!keys.length){ placeholder(body,"暂无准确率数据（等待首次预测）"); return; }
    body.innerHTML="<div class=\"chart\" id=\"acc-chart\"></div>"+keys.map(k=>{
      const acc=leagues[k];
      const rows=Object.entries(acc).filter(([kk])=>kk!=="generated_at"&&kk!=="data_window"&&typeof acc[kk]==="object");
      return "<div class=\"card\" style=\"margin-top:12px\"><div class=\"league-head\"><b>"+k+"</b></div>"+(rows.length?"<table><thead><tr><th>指标</th><th>数值</th></tr></thead><tbody>"+rows.map(r=>"<tr><td>"+esc(r[0])+"</td><td class=\"mono\">"+esc(JSON.stringify(r[1]))+"</td></tr>").join("")+"</tbody></table>":"<div class=\"empty\">该联赛暂无命中率数据</div>")+"</div>";
    }).join("");
    drawAccChart(leagues,keys);
  }catch(e){ placeholder(body,"加载失败："+e.message,"err"); }
}
function drawAccChart(leagues,keys){
  if(typeof echarts==="undefined") return;
  const el=document.getElementById("acc-chart");
  const chart=echarts.init(el);
  const series=[]; const cats=[]; const seen=new Set();
  keys.forEach(k=>{
    const acc=leagues[k];
    Object.entries(acc).forEach(([name,val])=>{
      if(typeof val!=="object"||!val) return;
      Object.keys(val).forEach(m=>{ if(!seen.has(name+"."+m)){ seen.add(name+"."+m); cats.push(name+"."+m);} });
    });
  });
  keys.forEach(k=>{
    const data=cats.map(c=>{const [n,m]=c.split(".");const v=(leagues[k][n]||{})[m];return typeof v==="number"?+(v*100).toFixed(1):null;});
    series.push({name:k,type:"line",data,connectNulls:true});
  });
  chart.setOption({
    title:{text:"命中率指标（%）",left:"center",textStyle:{color:"#e6ecf5",fontSize:13}},
    tooltip:{trigger:"axis"},
    legend:{top:26,textStyle:{color:"#8ea0b8"},type:"scroll"},
    grid:{left:16,right:16,top:70,bottom:16,containLabel:true},
    xAxis:{type:"category",data:cats,axisLabel:{color:"#8ea0b8"}},
    yAxis:{type:"value",axisLabel:{color:"#8ea0b8",formatter:"{value}%"}},
    series
  });
}
/* ---- tab: 任务与数据源 ---- */
async function loadOps(){
  const body=document.getElementById("ops-body");
  const [srcs, jobs]=await Promise.all([
    api("/sources/status").catch(e=>({_err:e.message,configured:[],enabled:{}})),
    api("/jobs").catch(e=>({_err:e.message,jobs:[]}))
  ]);
  const q=(srcs.jobs&&srcs.jobs.quota)||{day:"",used:0,limit:0};
  const pct=q.limit?Math.min(100,Math.round(q.used/q.limit*100)):0;
  const rows=(jobs.jobs||[]).map(j=>"<tr><td class=\"mono\">"+esc(j.id||"")+"</td><td><span class=\"badge "+(j.status==="done"?"ok":j.status==="running"||j.status==="queued"?"warn":"err")+"\">"+esc(j.status||"")+"</span></td><td>"+esc(j.trigger||"")+"</td><td class=\"mono\">"+esc((j.args||[]).join(" "))+"</td><td>"+esc(fmtDT(j.created_at))+"</td><td>"+esc(j.error||"")+"</td></tr>").join("");
  body.innerHTML=
    "<div class=\"grid\">"+
    "<div class=\"card\"><div class=\"league-head\"><b>手动触发预测</b></div>"+
    "<div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">"+
    "<button class=\"btn\" id=\"run-predict\">运行 predict</button>"+
    "<select id=\"run-league\" class=\"sel\"><option value=\"\">全部联赛</option><option>epl</option><option>laliga</option><option>bundesliga</option><option>seriea</option><option>ligue1</option></select>"+
    "<span class=\"small mut\">手动触发受当日配额限制</span></div>"+
    "<div id=\"run-status\" class=\"small mut\" style=\"margin-top:8px\"></div></div>"+
    "<div class=\"card\"><div class=\"league-head\"><b>当日配额</b><span class=\"small mut\">BJT "+esc(q.day||"")+"</span></div>"+
    "<div class=\"bar\"><i style=\"width:"+pct+"%\"></i></div>"+
    "<div class=\"small mut\" style=\"margin-top:6px\">"+q.used+"/"+q.limit+" 次使用</div></div>"+
    "</div>"+
    "<div class=\"panel\" style=\"margin-top:14px\"><h3>数据源状态</h3><div id=\"src-grid\"></div></div>"+
    "<div class=\"panel\"><h3>最近任务</h3><div id=\"job-table\">"+(rows?"<table><thead><tr><th>ID</th><th>状态</th><th>触发</th><th>参数</th><th>创建</th><th>错误</th></tr></thead><tbody>"+rows+"</tbody></table>":"<div class=\"empty\">暂无任务记录</div>")+"</div></div>";
  const sg=document.getElementById("src-grid");
  const names=(srcs.leagues&&srcs.leagues.epl&&srcs.leagues.epl.data_source||"");
  const srcHtml=(srcs.configured||[]).map(s=>"<div class=\"card\"><div class=\"league-head\"><b>"+esc(s)+"</b><span class=\"badge "+(srcs.enabled[s]?"ok":"warn")+"\">"+(srcs.enabled[s]?"已配置":"未配置")+"</span></div><div class=\"small mut\">默认源："+esc(srcs.default_source||"")+"</div></div>").join("");
  sg.innerHTML=srcHtml||"<div class=\"empty\">无可配置数据源</div>";
  document.getElementById("run-predict").addEventListener("click",runPredict);
  const active=srcs.jobs&&srcs.jobs.active;
  if(active){ pollJob(active.id); }
}
async function runPredict(){
  const btn=document.getElementById("run-predict"); btn.disabled=true;
  const st=document.getElementById("run-status"); st.textContent="提交中…";
  const body={}; const lv=document.getElementById("run-league").value; if(lv) body.league=lv;
  try{
    const res=await api("/jobs/predict",{method:"POST",body:JSON.stringify(body)});
    st.innerHTML="已提交任务 <span class=\"mono\">"+esc(res.job&&res.job.id||"")+"</span>，开始轮询…";
    pollJob(res.job.id);
  }catch(e){
    if(e.status===429){ st.innerHTML="<span class=\"err\">配额已用尽："+esc(e.message)+"</span>"; }
    else if(e.status===409){ st.innerHTML="<span class=\"warn\">已有任务在运行："+esc(e.message)+"</span>"; const srcs2=await api("/sources/status"); if(srcs2.jobs&&srcs2.jobs.active) pollJob(srcs2.jobs.active.id); }
    else { st.innerHTML="<span class=\"err\">"+esc(e.message)+"</span>"; }
    btn.disabled=false;
  }
}
function pollJob(jid){
  if(!jid) return;
  const st=document.getElementById("run-status"); if(!st) return;
  let timer=null;
  const tick=async()=>{
    try{
      const r=await api("/jobs/"+encodeURIComponent(jid));
      const j=r.job||{};
      st.textContent="任务 "+jid+"："+j.status;
      if(j.status==="done"){ st.innerHTML="<span class=\"badge ok\">done</span> 任务 "+(j.id||"")+" 完成（"+fmtDT(j.finished_at)+"）"; loadToday(); return; }
      if(j.status==="failed"||j.status==="timeout"){ st.innerHTML="<span class=\"badge err\">"+j.status+"</span> "+(j.error||""); return; }
      timer=setTimeout(tick,3000);
    }catch(e){ st.innerHTML="<span class=\"err\">轮询失败："+esc(e.message)+"</span>"; }
  };
  tick();
}
/* ---- 启动 ---- */
document.getElementById("hist-date").value=bjtToday();
loadToday();
</script>
