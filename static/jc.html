<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竞彩看板 - league-predict</title>
<style>
  body { margin:0; font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         background:#f1f5f9; color:#0f172a; }
  h1 { font-size:20px; }
  h2 { font-size:16px; margin:24px 0 4px; }
  .note { color:#64748b; font-size:12px; margin:0 0 8px; }
  .empty { color:#94a3b8; padding:16px; background:#fff; border-radius:8px; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:8px;
          overflow:hidden; box-shadow:0 1px 4px rgba(15,23,42,.08); }
  th,td { padding:6px 10px; border-bottom:1px solid #e2e8f0; font-size:13px; text-align:left; vertical-align:top; }
  th { background:#f8fafc; color:#334155; font-weight:600; }
  td { word-break:break-all; }
</style>
</head>
<body>
<main>
  <h1>竞彩看板（jc）</h1>
  <div id="auth">请先登录 <a href="/login">/login</a></div>
  <section id="s-fix"><h2>场次 × 盘口</h2><p class="note" id="n-fix"></p><div id="t-fix"></div></section>
  <section id="s-bt"><h2>基线指标</h2><p class="note" id="n-bt"></p><div id="t-bt"></div></section>
  <section id="s-is"><h2>期次</h2><p class="note" id="n-is"></p><div id="t-is"></div></section>
</main>
<script>
(function () {
  var FIX_COLS = ["match_num","league_cn","home_cn","away_cn","kickoff_bj","match_status",
                  "play_type","snap_ts","goal_line","options"];
  var BT_COLS = ["play_type","n_fp","brier","brier_uniform","acc","clv_filled"];
  var IS_COLS = ["game_num","issue_no","game_name","sale_begin","sale_end","draw_at",
                 "n_matches","head_source","draw_result","is_delay"];

  function esc(v) {
    return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function cell(v) {
    if (v === null || v === undefined) return "-";
    return esc(typeof v === "object" ? JSON.stringify(v) : String(v));
  }

  function table(cols, rows) {
    var h = "<table><tr>" + cols.map(function (c) { return "<th>" + c + "</th>"; }).join("") + "</tr>";
    rows.forEach(function (r) {
      h += "<tr>" + cols.map(function (c) { return "<td>" + cell(r[c]) + "</td>"; }).join("") + "</tr>";
    });
    return h + "</table>";
  }

  function render(id, data, cols) {
    document.getElementById("n-" + id).textContent = data.sql_note || "";
    var box = document.getElementById("t-" + id);
    if (!data.rows || !data.rows.length) { box.innerHTML = '<div class="empty">暂无数据</div>'; return; }
    box.innerHTML = table(cols, data.rows);
  }

  function showAuthOnly() {
    ["s-fix", "s-bt", "s-is"].forEach(function (id) { document.getElementById(id).style.display = "none"; });
    document.getElementById("auth").style.display = "";
  }

  Promise.all([
    fetch("/api/jc/fixtures", { credentials: "same-origin" }),
    fetch("/api/jc/backtest", { credentials: "same-origin" }),
    fetch("/api/jc/issues?limit=20", { credentials: "same-origin" })
  ]).then(function (rs) {
    if (rs.some(function (r) { return r.status === 401 || r.status === 403; })) { showAuthOnly(); return; }
    return Promise.all(rs.map(function (r) { return r.json(); }))
      .then(function (ds) {
        render("fix", ds[0], FIX_COLS);
        render("bt", ds[1], BT_COLS);
        render("is", ds[2], IS_COLS);
      });
  }).catch(function () { showAuthOnly(); });
})();
</script>
</body>
</html>
